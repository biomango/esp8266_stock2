name: Build ESP8266 Firmware

# 當有代碼 push 到 main / master 分支或發布 release 時觸發
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊按鈕執行編譯

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 切換並拉取倉庫程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. 安裝 PlatformIO Core
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # 4. 執行編譯 (會依據 platformio.ini 的設定編譯)
      - name: Build Firmware
        run: |
          pio run

      # 5. 上傳編譯出來的 .bin 檔案到 GitHub Artifacts (可在網頁直接下載)
      - name: Upload Firmware Binary
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-firmware
          path: .pio/build/nodemcuv2/firmware.bin
